detector:
  weights_path: "models/yolo_best.pt"
  imgsz: 320
  conf_thresh: 0.25
  iou_thresh: 0.45
  eye_class_id: 0
  face_class_id: 1
  eye_crop_size: [64, 64]
  box_padding_ratio: 0.0
  input_color_format: "RGB"
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  device: null

backbone:
  arch: "resnet18"              # "resnet18" | "mobilenet_v3_small" | "mobilenet_v3_large" | "custom_resnet"
  pretrained: true
  freeze_early_layers: true     # Freeze early pretrained stages & keep their BN stats frozen
  in_channels: 3
  embedding_dim: 64
  base_channels: 16             # Used only when arch == "custom_resnet"
  layers: [2, 2, 2, 1]          # Used only when arch == "custom_resnet"
  small_input_stem: true        # Used only when arch == "custom_resnet"
  dropout: 0.35
  zero_init_residual: true      # Used only when arch == "custom_resnet"
  norm_type: "group"            # Used only when arch == "custom_resnet"
  num_groups: 8                 # Used only when arch == "custom_resnet"
